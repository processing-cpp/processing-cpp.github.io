- slug: lightSpecular
  name: lightSpecular()
  cat_tag: Lights Camera / Lights
  description: Sets the specular color for lights. Affects materials with specular component.
  syntax: void lightSpecular(float r, float g, float b)
  params:
  - name: r
    type: float
    desc: red component
  - name: g
    type: float
    desc: green component
  - name: b
    type: float
    desc: blue component
  returns: void
  related:
  - specular
  - lights
  impl: "void lightSpecular(float r, float g, float b) {\n    // Store as pending so subsequent light\
    \ calls pick it up\n    pendingSpecR = lc(r); pendingSpecG = lc(g); pendingSpecB = lc(b);\n    //\
    \ Also apply to any already-created lights\n    for (int i = 0; i < lightIndex; i++) {\n        GLenum\
    \  lt  = GL_LIGHT0 + i;\n        GLfloat col[] = { pendingSpecR, pendingSpecG, pendingSpecB, 1.0f\
    \ };\n        glLightfv(lt, GL_SPECULAR, col);\n    }\n}"
