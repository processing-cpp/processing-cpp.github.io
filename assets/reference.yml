  - name: alignY
    type: int
    desc: TOP, BOTTOM, CENTER, or BASELINE (optional)
  returns: void
  related:
  - text
  - textSize
  impl: "void textAlign(int alignX, int alignY) {\n    // Map standard constants (LEFT=37, RIGHT=39, CENTER=3)\
    \ to align constants\n    auto mapAlign=[](int a)->int{\n        if(a==37||a==20) return LEFT_ALIGN;\
    \   // LEFT or LEFT_ALIGN\n        if(a==39||a==21) return RIGHT_ALIGN;  // RIGHT or RIGHT_ALIGN\n\
    \        if(a==3 ||a==25) return CENTER_ALIGN; // CENTER or CENTER_ALIGN\n        if(a==0)       \
    \  return BASELINE;\n        return a;\n    };\n    g_textAlignX = mapAlign(alignX);\n    if(alignY\
    \ >= 0) g_textAlignY = mapAlign(alignY);\n}"
