    \ r = 0.0f, ampl = 0.5f;\n    for (int oct = 0; oct < noiseOctaves; oct++) {\n        int of = xi\
    \ + (yi << PERLIN_YWRAPB) + (zi << PERLIN_ZWRAPB);\n        float rxf = noise_fsc(xf), ryf = noise_fsc(yf);\n\
