- slug: smooth
  name: smooth()
  cat_tag: Environment
  description: Draws all geometry with smooth (anti-aliased) edges. Enabled by default.
  syntax: void smooth()
  params: []
  returns: void
  related:
  - noSmooth
  impl: void smooth()  {smoothing=true; glEnable(GL_LINE_SMOOTH);glHint(GL_LINE_SMOOTH_HINT,GL_NICEST);glEnable(GL_POINT_SMOOTH);glHint(GL_POINT_SMOOTH_HINT,GL_NICEST);glEnable(GL_MULTISAMPLE);}
  under_the_hood_h: void smooth(int level = 2);
  under_the_hood_cpp: "void PApplet::smooth(int level) {\n    // The MAIN window's actual MSAA sample\
    \ count is fixed at window-creation\n    // time (GLFW_SAMPLES is a window hint, can't change after\
    \ the window\n    // exists) -- so smooth(level) can't retroactively change the main\n    // canvas's\
    \ hardware sample count the way real Processing's P2D/P3D\n    // renderers can. What we CAN do: store\
    \ the requested level (used by\n    // PGraphics buffers below, which DO get to choose their own sample\n\
    \    // count fresh at creation time), and toggle the same smoothing flags\n    // smooth() always\
    \ has, regardless of which level was requested.\n    smoothing = true;\n    smoothLevel = level;\n\
    \    glEnable(GL_LINE_SMOOTH);glHint(GL_LINE_SMOOTH_HINT,GL_NICEST);\n    glEnable(GL_POINT_SMOOTH);glHint(GL_POINT_SMOOTH_HINT,GL_NICEST);\n\
    \    glEnable(GL_MULTISAMPLE);\n}\n\nsmooth();"
