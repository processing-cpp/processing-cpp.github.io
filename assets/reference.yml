  impl: "PFont* createFont(const std::string& name, float size, bool /*smooth*/) {\n    PFont f(name,\
    \ size);\n    // Try as file path first, then common system paths\n    // Strip extension from name\
    \ if already present, to avoid double extensions\n    std::string baseName = name;\n    if (baseName.size()\
    \ > 4 && (baseName.substr(baseName.size()-4) == \".ttf\"\n                              || baseName.substr(baseName.size()-4)\
    \ == \".otf\")) {\n        // name already has extension -- use as-is for first attempt\n    } else\
    \ {\n        baseName = \"\"; // will build paths with extensions below\n    }\n\n    std::string\
    \ nameNoExt = name;\n    if (nameNoExt.size() > 4 && (nameNoExt.substr(nameNoExt.size()-4) == \".ttf\"\
    \n                               || nameNoExt.substr(nameNoExt.size()-4) == \".otf\"))\n        nameNoExt\
    \ = nameNoExt.substr(0, nameNoExt.size()-4);\n\n    std::vector<std::string> paths = {\n        //\
    \ Try exact name first (may already have extension)\n        name,\n        // Try adding extensions\
    \ if not already present\n        nameNoExt + \".ttf\",\n        nameNoExt + \".otf\",\n        //\
    \ Sketch data/ folder\n        std::string(\"data/\") + name,\n        std::string(\"data/\") + nameNoExt\
    \ + \".ttf\",\n        std::string(\"data/\") + nameNoExt + \".otf\",\n        // Sketch fonts/ folder\n\
    \        std::string(\"fonts/\") + name,\n        std::string(\"fonts/\") + nameNoExt + \".ttf\",\n\
    \        std::string(\"fonts/\") + nameNoExt + \".otf\",\n        // Linux system font directories\n\
    \        std::string(\"/usr/share/fonts/truetype/\") + nameNoExt + \".ttf\",\n        std::string(\"\
    /usr/share/fonts/opentype/\") + nameNoExt + \".otf\",\n        std::string(\"/usr/share/fonts/TTF/\"\
    ) + nameNoExt + \".ttf\",\n        std::string(\"/usr/share/fonts/OTF/\") + nameNoExt + \".otf\",\n\
    \        // Windows system fonts\n        std::string(\"C:/Windows/Fonts/\") + name,\n        std::string(\"\
    C:/Windows/Fonts/\") + nameNoExt + \".ttf\",\n        std::string(\"C:/Windows/Fonts/\") + nameNoExt\
    \ + \".otf\","
  under_the_hood_h: PFont* createFont(const std::string& name, float size, bool smooth=true);
