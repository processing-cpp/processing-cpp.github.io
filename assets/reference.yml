    \ x0=std::cos(a0)*std::cos(b),y0=std::sin(a0),z0=std::cos(a0)*std::sin(b);\n                glNormal3f(x1,y1,z1);\
    \ glVertex3f(r*x1,r*y1,r*z1);\n                glNormal3f(x0,y0,z0); glVertex3f(r*x0,r*y0,r*z0);\n\
    \            }\n            glEnd();\n        }\n        if (usePhong) glUseProgram(0);\n    }\n \
    \   if(doStroke){\n        applyStroke(); glLineWidth(strokeW);\n        // Draw sphere as a wireframe\
