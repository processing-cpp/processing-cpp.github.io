- slug: beginShape
  name: beginShape()
  cat_tag: Shape / Vertex
  description: Using beginShape() and endShape() allows creating complex forms. Optionally pass a shape
    kind.
  syntax: 'void beginShape()

    void beginShape(int kind)'
  params:
  - name: kind
    type: int
    desc: POINTS, LINES, TRIANGLES, TRIANGLE_FAN, TRIANGLE_STRIP, QUADS, QUAD_STRIP (optional)
  returns: void
  related:
  - endShape
  - vertex
  impl: "void beginShape(int kind){\n    shapeKind = kind;\n    inShape   = true;\n    shape3D   = false;\n\
    \    shapeVerts.clear();\n    shapeVerts3D.clear();\n    // Vertices are always collected in shapeVerts\
    \ / shapeVerts3D.\n    // endShape() draws fill and/or stroke from those collections.\n    // shape3D\
    \ is set when 3-component vertices are used (vertex(x,y,z)).\n}"
  under_the_hood_h: 'void beginShape();


    void beginShape(int k=-1)         { kind=k; verts.clear(); }


    void beginShape(int kind=-1);


    inline void PGraphics::beginShape()                                 { if(PApplet::g_papplet) PApplet::g_papplet->beginShape();
    }'
  under_the_hood_cpp: "void PApplet::beginShape(int kind){\n    shapeKind = kind;\n    inShape   = true;\n\
    \    shape3D   = false;\n    shapeVerts.clear();\n    shapeVerts3D.clear();\n    // Vertices are always\
    \ collected in shapeVerts / shapeVerts3D.\n    // endShape() draws fill and/or stroke from those collections.\n\
