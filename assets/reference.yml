- slug: PrintWriter_class
  name: PrintWriter
  cat_tag: Data / Composite
  description: Writes text to a file. Create with createWriter(). Always call close() or flush() when
    done.
  syntax: PrintWriter* writer = createWriter("output.txt")
  params: []
  returns: PrintWriter
  methods:
  - sig: print(T v)
    desc: Writes a value without a newline
  - sig: println(T v)
    desc: Writes a value followed by a newline
  - sig: println()
    desc: Writes a blank line
  - sig: flush()
    desc: Flushes the buffer to disk
  - sig: close()
    desc: Closes the file
  related:
  - createWriter
  - saveStrings
  impl: "class PrintWriter {\n    std::ofstream f;\npublic:\n    explicit PrintWriter(const std::string&\
    \ path) : f(path) {}\n    template<typename T> void print(const T& v)   { f << v; }\n    template<typename\
    \ T> void println(const T& v) { f << v << \"\\n\"; }\n    void println() { f << \"\\n\"; }\n    void\
    \ flush()   { f.flush(); }\n    void close()   { f.close(); }\n};"
