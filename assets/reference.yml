    \ pix = img->get(x,y)) -- two\n    // different, equally-valid implicit conversions for the same int\n\
    \    // literal. color(int gray) as an EXACT match resolves that in favor\n    // of \"grayscale\"\
    , matching real Processing semantics.\n    color(int gray);\n    color(int gray, int a);\n    // Use\
    \ explicit cast: color(0,153,204,(int)a) or color(0.f,153.f,204.f,a)\n    color(float gray);\n   \
    \ color(float gray, float a);\n    color(float r, float g, float b);\n    color(float r, float g,\
    \ float b, float a);\n\n    explicit operator unsigned int() const { return value; }\n    unsigned\
    \ int toInt() const { return value; }\n    // In Processing Java, color IS int. Allow implicit color<->int\
    \ conversion\n    // so sketches can write: int c = color(255); int c = lerpColor(a,b,t);\n    operator\
    \ int() const { return (int)value; }\n    // fromRaw: convert raw int (Java color int) directly to\
    \ color value\n    static color fromRaw(int v) { color c; c.value=(unsigned int)v; return c; }\n \
