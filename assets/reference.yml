- slug: textAlign
  name: textAlign()
  cat_tag: Typography / Attributes
  description: Sets the alignment for drawing text. The first parameter can be LEFT, CENTER, or RIGHT.
    The second parameter (optional) can be TOP, BOTTOM, CENTER, or BASELINE.
  syntax: 'void textAlign(int alignX)

