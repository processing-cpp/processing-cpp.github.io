- slug: ortho
  name: ortho()
  cat_tag: Lights Camera / Camera
  description: Sets an orthographic projection, where objects appear flat and no foreshortening occurs.
  syntax: 'void ortho()

    void ortho(float left, float right, float bottom, float top, float near, float far)'
  params:
  - name: left
    type: float
    desc: left clipping plane
  - name: right
    type: float
    desc: right clipping plane
  - name: bottom
    type: float
    desc: bottom clipping plane
  - name: top
    type: float
    desc: top clipping plane
  - name: near
    type: float
    desc: near clipping plane
  - name: far
    type: float
    desc: far clipping plane
  returns: void
  related:
  - perspective
  - camera
  impl: "void ortho() {\n    // Default ortho: 1:1 pixel mapping, origin at top-left, Y increases downward.\n\
    \    // glOrtho(l, r, bottom, top, near, far):\n    //   bottom = winHeight (screen bottom = large\
    \ Y in Processing)\n    //   top    = 0         (screen top    = Y=0 in Processing)\n    // gluLookAt\
    \ is NOT used here -- we want raw screen-space coordinates,\n    // so we use a simple identity modelview\
    \ with Y-flipped glOrtho.\n    glMatrixMode(GL_PROJECTION); glLoadIdentity();\n    glOrtho(0, logicalW,\
    \ logicalH, 0, -logicalH, logicalH);\n    glMatrixMode(GL_MODELVIEW); glLoadIdentity();\n    glFrontFace(GL_CW);\n\
    \    glDisable(GL_CULL_FACE);\n    glEnable(GL_DEPTH_TEST);\n    glDepthFunc(GL_LESS);\n}"
  under_the_hood_h: 'void ortho();


    void ortho(float l, float r, float b, float t, float n, float f);'
  under_the_hood_cpp: "void PApplet::ortho() {\n    // Default ortho: 1:1 pixel mapping, origin at top-left,\
    \ Y increases downward.\n    // glOrtho(l, r, bottom, top, near, far):\n    //   bottom = winHeight\
    \ (screen bottom = large Y in Processing)\n    //   top    = 0         (screen top    = Y=0 in Processing)\n\
    \    // gluLookAt is NOT used here -- we want raw screen-space coordinates,\n    // so we use a simple\
    \ identity modelview with Y-flipped glOrtho.\n    glMatrixMode(GL_PROJECTION); glLoadIdentity();\n\
    \    glOrtho(0, logicalW, logicalH, 0, -logicalH, logicalH);\n    glMatrixMode(GL_MODELVIEW); glLoadIdentity();\n\
    \    glFrontFace(GL_CW);\n    glDisable(GL_CULL_FACE);\n    glEnable(GL_DEPTH_TEST);\n    glDepthFunc(GL_LESS);\n\
    }\n\nvoid PApplet::ortho(float l, float r, float b, float t, float n, float f) {\n    // Processing\
    \ Java ortho() uses the SAME standard modelview as perspective()\n    // (eye at eyeZ above canvas\
    \ center, looking at canvas center).\n    // Only the projection changes: orthographic instead of\
    \ frustum.\n    // The Y-flip (glScalef 1,-1,1) is applied in projection space so that\n    // Processing's\
    \ Y-down screen coordinate convention is preserved.\n    //\n    // With the standard camera, world\
    \ point (w/2, h/2, 0) is at screen center.\n    // ortho(-w/2, w/2, -h/2, h/2) covers that range around\
    \ the camera target.\n    // So translate(w/2, h/2) correctly lands at the center of the screen.\n\
    \    glMatrixMode(GL_PROJECTION); glLoadIdentity();\n    glScalef(1,-1,1);  // Y-flip before ortho\
    \ (Java order)\n    glOrtho(l, r, b, t, n, f);\n    applyStandardModelview();\n}"
