- slug: saveFrame
  name: saveFrame()
  cat_tag: Output / Image
  description: 'Saves a numbered image file. Use #### as a placeholder for the frame number.'
  syntax: void saveFrame(std::string filename)
  params:
  - name: filename
    type: std::string
    desc: filename template, e.g. frame-####.png
  returns: void
  related:
  - save
  impl: "void saveFrame(const std::string& fn){\n    std::cout<<\"saveFrame: \"<<fn<<\" (enable stb_image_write\
    \ in Processing.cpp)\\n\";\n}"
  under_the_hood_h: void saveFrame(const std::string& filename="frame-####.png");
  under_the_hood_cpp: "void PApplet::saveFrame(const std::string& filename) {\n    std::string fn = filename;\n\
    \    size_t pos = fn.find(\"####\");\n    if (pos != std::string::npos) {\n        char buf[16];\n\
    \        snprintf(buf, sizeof(buf), \"%04d\", frameCount);\n        fn.replace(pos, 4, buf);\n   \
    \ }\n    int w = pixelWidth  > 0 ? pixelWidth  : logicalW;\n    int h = pixelHeight > 0 ? pixelHeight\
    \ : logicalH;\n    std::vector<unsigned char> px(w * h * 3);\n    glPixelStorei(GL_PACK_ALIGNMENT,\
    \ 1);\n    glReadPixels(0, 0, w, h, GL_RGB, GL_UNSIGNED_BYTE, px.data());\n    for (int y = 0; y <\
    \ h / 2; y++)\n        for (int x = 0; x < w * 3; x++)\n            std::swap(px[y*w*3+x], px[(h-1-y)*w*3+x]);\n\
    \    std::string ext = fn.size() > 4 ? fn.substr(fn.size()-4) : \"\";\n    for (auto& c : ext) c =\
    \ tolower(c);\n    int ok = 0;\n    if (ext == \".png\")                ok = stbi_write_png(fn.c_str(),\
    \ w, h, 3, px.data(), w*3);\n    else if (ext == \".jpg\" || ext == \"jpeg\") ok = stbi_write_jpg(fn.c_str(),\
    \ w, h, 3, px.data(), 95);\n    else if (ext == \".bmp\")           ok = stbi_write_bmp(fn.c_str(),\
    \ w, h, 3, px.data());\n    else if (ext == \".tga\" || ext == \".tif\" || ext == \".tiff\")\n   \
    \                                   ok = stbi_write_tga(fn.c_str(), w, h, 3, px.data());\n    else\
    \ { fn += \".png\"; ok = stbi_write_png(fn.c_str(), w, h, 3, px.data(), w*3); }\n    if (ok) std::cout\
    \ << \"Saved: \" << fn << \"\\n\";\n    else    std::cout << \"save: failed to write \" << fn << \"\
    \\n\";\n}\n\nvoid PApplet::save(const std::string& fn){saveFrame(fn);"
