- slug: loadImage
  name: loadImage()
  cat_tag: Image / Loading & Displaying
  description: 'Loads an image into a variable of type PImage. Supported formats: PNG, JPG, GIF, TGA.
    Images are loaded from the sketch''s data folder.'
  syntax: PImage* loadImage(std::string path)
  params:
  - name: path
    type: std::string
    desc: path to the image file
  returns: PImage*
  related:
  - image
  - createImage
  impl: "PImage* loadImage(const std::string& path){\n    // Handle URLs: download with curl/wget and\
    \ validate image magic bytes\n    if (path.size()>7 && (path.substr(0,7)==\"http://\" || path.substr(0,8)==\"\
    https://\")){\n#ifdef _WIN32\n        std::string tmp=std::string(getenv(\"TEMP\")?getenv(\"TEMP\"\
    ):\"C:\\\\Temp\")+\"\\\\pg_img_\";\n#else\n        std::string tmp=\"/tmp/pg_img_\";\n#endif\n   \
    \     size_t sl=path.rfind('/');\n        std::string bn=(sl!=std::string::npos)?path.substr(sl+1):\"\
    img.png\";\n        { size_t q=bn.find('?'); if(q!=std::string::npos) bn=bn.substr(0,q); }\n     \
    \   if(bn.empty()||bn.find('.')==std::string::npos) bn=\"img.png\";\n        for(char& c:bn) if(c==':'||c=='*'||c=='<'||c=='>'||c=='|')\
    \ c='_';\n        tmp+=bn;\n        auto isValidImg=[&]()->bool{\n            FILE* f2=fopen(tmp.c_str(),\"\
    rb\"); if(!f2) return false;\n            fseek(f2,0,SEEK_END); long sz=ftell(f2); fseek(f2,0,SEEK_SET);\n\
    \            unsigned char h[4]={}; fread(h,1,4,f2); fclose(f2);\n            if(sz<100) return false;\n\
    \            return (h[0]==0x89&&h[1]=='P')|| // PNG\n                   (h[0]==0xFF&&h[1]==0xD8)||\
    \ // JPEG\n                   (h[0]=='G'&&h[1]=='I')||   // GIF\n                   (h[0]=='B'&&h[1]=='M')||\
    \   // BMP\n                   (h[0]=='R'&&h[1]=='I');    // WEBP\n        };\n        // Try curl\n\
    #ifdef _WIN32\n        system((\"curl -sL --max-time 15 -o \\\"\"+tmp+\"\\\" \\\"\"+path+\"\\\"\"\
    ).c_str());\n#else\n        system((\"curl -sL --max-time 15 -o '\"+tmp+\"' '\"+path+\"'\").c_str());\n\
    #endif\n        if(!isValidImg()){\n            // Try wget as fallback\n#ifdef _WIN32\n         \
    \   system((\"wget -q -O \\\"\"+tmp+\"\\\" \\\"\"+path+\"\\\"\").c_str());\n#else\n            system((\"\
    wget -q -O '\"+tmp+\"' '\"+path+\"'\").c_str());\n#endif\n        }\n        if(isValidImg()){"
  under_the_hood_h: PImage*    loadImage(const std::string& path);
  under_the_hood_cpp: "PImage* PApplet::loadImage(const std::string& path){\n    // Handle URLs: download\
    \ with curl/wget and validate image magic bytes\n    if (path.size()>7 && (path.substr(0,7)==\"http://\"\
    \ || path.substr(0,8)==\"https://\")){\n#ifdef _WIN32\n        std::string tmp=std::string(getenv(\"\
    TEMP\")?getenv(\"TEMP\"):\"C:\\\\Temp\")+\"\\\\pg_img_\";\n#else\n        std::string tmp=\"/tmp/pg_img_\"\
    ;\n#endif\n        size_t sl=path.rfind('/');\n        std::string bn=(sl!=std::string::npos)?path.substr(sl+1):\"\
    img.png\";\n        { size_t q=bn.find('?'); if(q!=std::string::npos) bn=bn.substr(0,q); }\n     \
    \   if(bn.empty()||bn.find('.')==std::string::npos) bn=\"img.png\";\n        for(char& c:bn) if(c==':'||c=='*'||c=='<'||c=='>'||c=='|')\
    \ c='_';\n        tmp+=bn;\n        auto isValidImg=[&]()->bool{\n            FILE* f2=fopen(tmp.c_str(),\"\
    rb\"); if(!f2) return false;\n            fseek(f2,0,SEEK_END); long sz=ftell(f2); fseek(f2,0,SEEK_SET);\n\
    \            unsigned char h[4]={}; fread(h,1,4,f2); fclose(f2);\n            if(sz<100) return false;\n\
    \            return (h[0]==0x89&&h[1]=='P')|| // PNG\n                   (h[0]==0xFF&&h[1]==0xD8)||\
    \ // JPEG\n                   (h[0]=='G'&&h[1]=='I')||   // GIF\n                   (h[0]=='B'&&h[1]=='M')||\
    \   // BMP\n                   (h[0]=='R'&&h[1]=='I');    // WEBP\n        };\n        // Try curl\n\
    #ifdef _WIN32\n        system((\"curl -sL --max-time 15 -o \\\"\"+tmp+\"\\\" \\\"\"+path+\"\\\"\"\
    ).c_str());\n#else\n        system((\"curl -sL --max-time 15 -o '\"+tmp+\"' '\"+path+\"'\").c_str());\n\
    #endif\n        if(!isValidImg()){\n            // Try wget as fallback\n#ifdef _WIN32\n         \
    \   system((\"wget -q -O \\\"\"+tmp+\"\\\" \\\"\"+path+\"\\\"\").c_str());\n#else\n            system((\"\
    wget -q -O '\"+tmp+\"' '\"+path+\"'\").c_str());\n#endif\n        }\n        if(isValidImg()){\n \
    \           PImage* r2=loadImage(tmp);\n            if(r2&&r2->width>0) return r2;\n        }\n  \
    \      fprintf(stderr,\"[loadImage] URL download failed: %s\\n\",path.c_str());\n        return nullptr;\n\
    \    }\n    // Search paths: current dir, data/, files/, and sketch subdirs\n    // Check PROCESSING_SKETCH_PATH\
    \ env var set by IDE\n    std::string _sketchDir;\n    if (const char* _sp = std::getenv(\"PROCESSING_SKETCH_PATH\"\
    ))\n        _sketchDir = std::string(_sp) + \"/\";\n    // Also get the directory of the running executable\n\
    \    std::string _exeDir;\n    {\n        char _buf[4096] = {};\n#ifdef _WIN32\n        GetModuleFileNameA(nullptr,\
    \ _buf, sizeof(_buf));\n        std::string _ep(_buf);\n        size_t _sl = _ep.find_last_of(\"\\\
    \\\\\\\");\n#else\n        ssize_t _len = readlink(\"/proc/self/exe\", _buf, sizeof(_buf)-1);\n  \
    \      if (_len > 0) _buf[_len] = 0;\n        std::string _ep(_buf);\n        size_t _sl = _ep.find_last_of(\"\
    /\");\n#endif\n        if (_sl != std::string::npos) _exeDir = _ep.substr(0, _sl+1);\n    }\n    std::vector<std::string>\
    \ tries = {\n        path,\n        \"data/\" + path,\n        \"files/\" + path,\n        \"../data/\"\
    \ + path,\n        _sketchDir + path,\n        _sketchDir + \"data/\" + path,\n        _exeDir + path,\n\
    \        _exeDir + \"data/\" + path,    // in case running from a subdirectory\n    };\n#ifdef PROCESSING_HAS_STB_IMAGE\n\
    \    for (auto& p : tries) {\n        int w, h, ch;\n        unsigned char* data = stbi_load(p.c_str(),\
    \ &w, &h, &ch, 4);\n        if (!data) continue;\n        PImage* img = new PImage(w, h);\n      \
    \  for (int i = 0; i < w*h; i++) {\n            unsigned char r=data[i*4+0], g=data[i*4+1], b=data[i*4+2],\
    \ a=data[i*4+3];\n            img->pixels[i] = ((unsigned int)a<<24)|((unsigned int)r<<16)|((unsigned\
    \ int)g<<8)|b;\n        }\n        stbi_image_free(data);\n        img->dirty = true;\n        return\
    \ img;\n    }\n#endif\n    for (auto& p : tries)\n        std::cerr << \"[loadImage] not found: \"\
    \ << p << \"\\n\";\n    std::cerr << \"[loadImage] returning empty image -- check the path above\\\
    n\";\n    return new PImage(); // return empty (not null) so -> calls are safe\n}"
