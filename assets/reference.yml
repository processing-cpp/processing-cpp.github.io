    \   }\n        }\n        // Top latitude ring\n        {\n            float lat1=PI*(-0.5f+(float)stacks/stacks);\n\
    \            for(int j=0;j<slices;j++){\n                float lng0=TWO_PI*(float)j/slices;\n    \
    \            float lng1=TWO_PI*(float)(j+1)/slices;\n                sv(lat1,lng0); sv(lat1,lng1);\n\
    \            }\n        }\n        glEnd();\n        restoreLighting();\n    }\n}"
