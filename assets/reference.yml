- slug: captureMouse
  name: captureMouse()
  cat_tag: Environment
  description: Locks the cursor to the window and enables raw mouse input, removing OS acceleration. Essential
    for FPS-style games. Use releaseMouse() to unlock.
  syntax: void captureMouse()
  params: []
  returns: void
  related:
  - releaseMouse
  - mouseDX
  - mouseDY
  impl: "void captureMouse() {if(gWindow){glfwSetInputMode(gWindow,GLFW_CURSOR,GLFW_CURSOR_DISABLED);\n\
    \    // Enable raw motion if supported (removes OS acceleration)\n    if(glfwRawMouseMotionSupported())\n\
    \        glfwSetInputMode(gWindow,GLFW_RAW_MOUSE_MOTION,GLFW_TRUE);}}"
  under_the_hood_h: void captureMouse();
  under_the_hood_cpp: "void PApplet::captureMouse() {if(gWindow){glfwSetInputMode(gWindow,GLFW_CURSOR,GLFW_CURSOR_DISABLED);\n\
    \    // Enable raw motion if supported (removes OS acceleration)\n    if(glfwRawMouseMotionSupported())\n\
    \        glfwSetInputMode(gWindow,GLFW_RAW_MOUSE_MOTION,GLFW_TRUE);}}"
