- slug: blendMode
  name: blendMode()
  cat_tag: Rendering
  description: Blends the pixels in the display window with the pixels underneath using a defined blend
    mode.
  syntax: void blendMode(int mode)
  params:
  - name: mode
    type: int
    desc: BLEND, ADD, SUBTRACT, MULTIPLY, SCREEN, DARKEST, LIGHTEST, DIFFERENCE, EXCLUSION
  returns: void
  impl: "void blendMode(int mode) {\n    glEnable(GL_BLEND);\n    // Reset equation first (SUBTRACT changes\
    \ it)\n    glBlendEquation(GL_FUNC_ADD);\n    switch (mode) {\n        case ADD:      glBlendFunc(GL_SRC_ALPHA,\
    \ GL_ONE);                break;\n        case MULTIPLY: glBlendFunc(GL_DST_COLOR, GL_ZERO);     \
    \          break;\n        case SCREEN:   glBlendFunc(GL_ONE, GL_ONE_MINUS_SRC_COLOR);      break;\n\
    \        case SUBTRACT:\n            glBlendEquation(GL_FUNC_REVERSE_SUBTRACT);\n            glBlendFunc(GL_SRC_ALPHA,\
    \ GL_ONE);\n            break;\n        default:       glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA);\
    \ break;\n    }\n}"
  under_the_hood_h: void blendMode(int mode);
  under_the_hood_cpp: "void PApplet::blendMode(int mode) {\n    glEnable(GL_BLEND);\n    // Reset equation\
    \ first (SUBTRACT changes it)\n    glBlendEquation(GL_FUNC_ADD);\n    switch (mode) {\n        case\
    \ ADD:      glBlendFunc(GL_SRC_ALPHA, GL_ONE);                break;\n        case MULTIPLY: glBlendFunc(GL_DST_COLOR,\
    \ GL_ZERO);               break;\n        case SCREEN:   glBlendFunc(GL_ONE, GL_ONE_MINUS_SRC_COLOR);\
    \      break;\n        case SUBTRACT:\n            glBlendEquation(GL_FUNC_REVERSE_SUBTRACT);\n  \
    \          glBlendFunc(GL_SRC_ALPHA, GL_ONE);\n            break;\n        default:       glBlendFunc(GL_SRC_ALPHA,\
    \ GL_ONE_MINUS_SRC_ALPHA); break;\n    }\n}"
