    \ each quad cell.\n        auto sv = [&](float lat, float lng) {\n            glVertex3f(r*std::cos(lat)*std::cos(lng),\n\
    \                       r*std::sin(lat),\n                       r*std::cos(lat)*std::sin(lng));"
