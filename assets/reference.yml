- slug: lerpColor
  name: lerpColor()
  cat_tag: Color / Creating & Reading
  description: Calculates a color between two colors at a specific increment.
  syntax: color lerpColor(color c1, color c2, float t)
  params:
  - name: c1
    type: color
    desc: interpolate from this color
  - name: c2
    type: color
    desc: interpolate to this color
  - name: t
    type: float
    desc: between 0.0 and 1.0
  returns: color
  related:
  - lerp
  - color_fn
  impl: "color lerpColor(color c1, color c2, float t) {\n    unsigned int v1 = c1.value;\n    unsigned\
    \ int v2 = c2.value;\n\n    int r1 = (v1 >> 16) & 0xFF,  r2 = (v2 >> 16) & 0xFF;\n    int g1 = (v1\
    \ >>  8) & 0xFF,  g2 = (v2 >>  8) & 0xFF;\n    int b1 =  v1        & 0xFF,  b2 =  v2        & 0xFF;\n\
    \    int a1 = (v1 >> 24) & 0xFF,  a2 = (v2 >> 24) & 0xFF;\n\n    return colorVal(\n        (int)(r1\
    \ + t * (r2 - r1)),\n        (int)(g1 + t * (g2 - g1)),\n        (int)(b1 + t * (b2 - b1)),\n    \
    \    (int)(a1 + t * (a2 - a1))\n    );\n}"
  under_the_hood_h: color lerpColor(color c1, color c2, float t);
  under_the_hood_cpp: "color PApplet::lerpColor(color c1, color c2, float t) {\n    unsigned int v1 =\
    \ c1.value;\n    unsigned int v2 = c2.value;\n\n    int r1 = (v1 >> 16) & 0xFF,  r2 = (v2 >> 16) &\
    \ 0xFF;\n    int g1 = (v1 >>  8) & 0xFF,  g2 = (v2 >>  8) & 0xFF;\n    int b1 =  v1        & 0xFF,\
    \  b2 =  v2        & 0xFF;\n    int a1 = (v1 >> 24) & 0xFF,  a2 = (v2 >> 24) & 0xFF;\n\n    return\
    \ colorVal(\n        (int)(r1 + t * (r2 - r1)),\n        (int)(g1 + t * (g2 - g1)),\n        (int)(b1\
    \ + t * (b2 - b1)),\n        (int)(a1 + t * (a2 - a1))\n    );\n}"
