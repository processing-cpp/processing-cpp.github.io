- slug: filter
  name: filter()
  cat_tag: Image / Pixels
  description: 'Applies a filter to the display. Available filters: GRAY, INVERT, THRESHOLD.'
  syntax: 'void filter(int mode)

    void filter(int mode, float param)'
  params:
  - name: mode
    type: int
    desc: GRAY, INVERT, THRESHOLD, BLUR_FILTER, POSTERIZE
  - name: param
    type: float
    desc: parameter for some filters (optional)
  returns: void
  related:
  - loadPixels
  impl: void filter(int mode) { filter(mode, 0.5f); }
  under_the_hood_h: "void filter(int mode) {\n        for (auto& p : pixels) {\n            int r=(p>>16)&0xFF,\
    \ g=(p>>8)&0xFF, b=p&0xFF, a=(p>>24)&0xFF;\n            if      (mode == GRAY)      { int gr=(r+g+b)/3;\
    \ p=(a<<24)|(gr<<16)|(gr<<8)|gr; }\n            else if (mode == INVERT)    { p=(a<<24)|((255-r)<<16)|((255-g)<<8)|(255-b);\
    \ }\n            else if (mode == THRESHOLD) { int gr=(r+g+b)/3; int t=gr>127?255:0; p=(a<<24)|(t<<16)|(t<<8)|t;\
    \ }\n        }\n        dirty = true;\n    }\n\nvoid filter(int mode);\n\nvoid filter(int mode, float\
    \ param);"
  under_the_hood_cpp: "void PApplet::filter(int mode) { filter(mode, 0.5f); }\n\nvoid PApplet::filter(int\
    \ mode) { filter(mode, 0.5f);\n\nvoid PApplet::filter(int mode, float /*param*/) {\n    int total\
    \ = winWidth * winHeight;\n    std::vector<unsigned char> buf(total * 4);\n    glReadPixels(0, 0,\
    \ winWidth, winHeight, GL_RGBA, GL_UNSIGNED_BYTE, buf.data());\n\n    for (int i = 0; i < total; i++)\
    \ {\n        int r = buf[i*4], g = buf[i*4+1], b = buf[i*4+2];\n        int grey = (r + g + b) / 3;\n\
    \n        if (mode == GRAY) {\n            buf[i*4] = buf[i*4+1] = buf[i*4+2] = (unsigned char)grey;\n\
    \        } else if (mode == INVERT) {\n            buf[i*4]   = 255 - r;\n            buf[i*4+1] =\
    \ 255 - g;\n            buf[i*4+2] = 255 - b;\n        } else if (mode == THRESHOLD) {\n         \
    \   unsigned char t = (grey > 127) ? 255 : 0;\n            buf[i*4] = buf[i*4+1] = buf[i*4+2] = t;\n\
    \        }\n    }\n    glDrawPixels(winWidth, winHeight, GL_RGBA, GL_UNSIGNED_BYTE, buf.data());\n\
    }"
