- slug: blend_fn
  name: blend()
  cat_tag: Image / Pixels
  description: Copies a region of pixels from one image into another with full alpha channel blending.
    Blend modes include BLEND, ADD, SUBTRACT, MULTIPLY, SCREEN, DARKEST, LIGHTEST, DIFFERENCE, EXCLUSION.
  syntax: void blend(int sx, int sy, int sw, int sh, int dx, int dy, int dw, int dh, int mode)
  params:
  - name: sx
    type: int
    desc: x-coordinate of source region
  - name: sy
    type: int
    desc: y-coordinate of source region
  - name: sw
    type: int
    desc: source region width
  - name: sh
    type: int
    desc: source region height
  - name: dx
    type: int
    desc: x-coordinate of destination
  - name: dy
    type: int
    desc: y-coordinate of destination
  - name: dw
    type: int
    desc: destination width
  - name: dh
    type: int
    desc: destination height
  - name: mode
    type: int
    desc: blend mode constant
  returns: void
  related:
  - blendMode
  - copy_fn
  - filter
  impl: "void blend(int sx,int sy,int sw,int sh,int dx,int dy,int dw,int dh,int mode){\n    std::vector<unsigned\
    \ char> src(sw*sh*4);\n    glReadPixels(sx,winHeight-(sy+sh),sw,sh,GL_RGBA,GL_UNSIGNED_BYTE,src.data());\n\
    \    std::vector<unsigned char> dst(dw*dh*4);\n    for(int y=0;y<dh;y++) for(int x=0;x<dw;x++){\n\
    \        int srcX=(int)(x*(float)sw/dw), srcY=(int)(y*(float)sh/dh);\n        for(int c=0;c<4;c++)\
    \ dst[(y*dw+x)*4+c]=src[(srcY*sw+srcX)*4+c];\n    }\n    GLenum sfact=GL_SRC_ALPHA,dfact=GL_ONE_MINUS_SRC_ALPHA;\n\
    \    switch(mode){\n        case ADD:     sfact=GL_SRC_ALPHA;dfact=GL_ONE;break;\n        case MULTIPLY:sfact=GL_DST_COLOR;dfact=GL_ZERO;break;\n\
    \        default: break;\n    }\n    glEnable(GL_BLEND);glBlendFunc(sfact,dfact);\n    glWindowPos2i(dx,winHeight-(dy+dh));\n\
    \    glDrawPixels(dw,dh,GL_RGBA,GL_UNSIGNED_BYTE,dst.data());\n    glBlendFunc(GL_SRC_ALPHA,GL_ONE_MINUS_SRC_ALPHA);\n\
    }"
  under_the_hood_h: "static PColor blend(const PColor& src, const PColor& dst) {\n        float sa = src.a/255.f;\n\
    \        return PColor(src.r*sa+dst.r*(1-sa), src.g*sa+dst.g*(1-sa), src.b*sa+dst.b*(1-sa), 255);\n\
    \    }\n\nvoid blend(int sx, int sy, int sw, int sh, int dx, int dy, int dw, int dh, int mode);"
  under_the_hood_cpp: "void PApplet::blend(int sx,int sy,int sw,int sh,int dx,int dy,int dw,int dh,int\
    \ mode){\n    std::vector<unsigned char> src(sw*sh*4);\n    glReadPixels(sx,winHeight-(sy+sh),sw,sh,GL_RGBA,GL_UNSIGNED_BYTE,src.data());\n\
    \    std::vector<unsigned char> dst(dw*dh*4);\n    for(int y=0;y<dh;y++) for(int x=0;x<dw;x++){\n\
    \        int srcX=(int)(x*(float)sw/dw), srcY=(int)(y*(float)sh/dh);\n        for(int c=0;c<4;c++)\
    \ dst[(y*dw+x)*4+c]=src[(srcY*sw+srcX)*4+c];\n    }\n    GLenum sfact=GL_SRC_ALPHA,dfact=GL_ONE_MINUS_SRC_ALPHA;\n\
    \    switch(mode){\n        case ADD:     sfact=GL_SRC_ALPHA;dfact=GL_ONE;break;\n        case MULTIPLY:sfact=GL_DST_COLOR;dfact=GL_ZERO;break;\n\
    \        default: break;\n    }\n    glEnable(GL_BLEND);glBlendFunc(sfact,dfact);\n    glWindowPos2i(dx,winHeight-(dy+dh));\n\
    \    glDrawPixels(dw,dh,GL_RGBA,GL_UNSIGNED_BYTE,dst.data());\n    glBlendFunc(GL_SRC_ALPHA,GL_ONE_MINUS_SRC_ALPHA);\n\
    }\n\nblend(sx,sy,sw,sh,dx,dy,dw,dh,BLEND);"
