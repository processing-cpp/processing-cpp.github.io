  params:
  - name: x1
    type: float
    desc: x-coordinate of the first vertex
  - name: y1
    type: float
    desc: y-coordinate of the first vertex
  - name: x2
    type: float
    desc: x-coordinate of the second vertex
  - name: y2
    type: float
    desc: y-coordinate of the second vertex
  - name: x3
    type: float
    desc: x-coordinate of the third vertex
  - name: y3
    type: float
    desc: y-coordinate of the third vertex
  returns: void
  related:
  - quad
  impl: "void triangle(float x1, float y1, float x2, float y2, float x3, float y3) {\n    if (doFill)\
    \ {\n        applyFill();\n        glBegin(GL_TRIANGLES);\n            glVertex2f(x1, y1);\n     \
    \       glVertex2f(x2, y2);\n            glVertex2f(x3, y3);\n        glEnd();\n    }\n    if (doStroke)\
    \ {\n        applyStroke();\n        glLineWidth(strokeW);\n        glBegin(GL_LINE_LOOP);\n     \
    \       glVertex2f(x1, y1);\n            glVertex2f(x2, y2);\n            glVertex2f(x3, y3);\n  \
    \      glEnd();\n        restoreLighting();\n    }\n}"
