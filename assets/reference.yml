- slug: bezierVertex
  name: bezierVertex()
  cat_tag: Shape / Vertex
  description: Specifies vertex coordinates for bezier curves inside beginShape()/endShape().
  syntax: void bezierVertex(float cx1, float cy1, float cx2, float cy2, float x, float y)
  params:
  - name: cx1
    type: float
    desc: x of first control point
  - name: cy1
    type: float
    desc: y of first control point
  - name: cx2
    type: float
    desc: x of second control point
  - name: cy2
    type: float
    desc: y of second control point
  - name: x
    type: float
    desc: x of anchor point
  - name: y
    type: float
    desc: y of anchor point
  returns: void
  related:
  - beginShape
  - vertex
  - curveVertex
  impl: "void bezierVertex(float cx1,float cy1,float cx2,float cy2,float x,float y){\n    if(!inShape||shapeVerts.empty())return;\n\
    \    auto[x0,y0]=shapeVerts.back();const int sg=bezierDetailVal;\n    for(int i=1;i<=sg;i++){float\
    \ t=i/(float)sg,u=1-t;\n        float bx=u*u*u*x0+3*u*u*t*cx1+3*u*t*t*cx2+t*t*t*x, by=u*u*u*y0+3*u*u*t*cy1+3*u*t*t*cy2+t*t*t*y;\n\
    \        shapeVerts.push_back({bx,by}); shapeVerts3D.push_back({bx,by,0.0f});}\n}"
  under_the_hood_h: void bezierVertex(float cx1, float cy1, float cx2, float cy2, float x, float y);
  under_the_hood_cpp: "void PApplet::bezierVertex(float cx1,float cy1,float cx2,float cy2,float x,float\
    \ y){\n    if(!inShape||shapeVerts.empty())return;\n    auto[x0,y0]=shapeVerts.back();const int sg=bezierDetailVal;\n\
    \    for(int i=1;i<=sg;i++){float t=i/(float)sg,u=1-t;\n        float bx=u*u*u*x0+3*u*u*t*cx1+3*u*t*t*cx2+t*t*t*x,\
    \ by=u*u*u*y0+3*u*u*t*cy1+3*u*t*t*cy2+t*t*t*y;\n        shapeVerts.push_back({bx,by}); shapeVerts3D.push_back({bx,by,0.0f});}\n\
