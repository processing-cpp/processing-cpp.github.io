- slug: createGraphics
  name: createGraphics()
  cat_tag: Rendering
  description: Creates an off-screen rendering surface (PGraphics). Draw into it using beginDraw()/endDraw(),
    then display with image().
  syntax: PGraphics* createGraphics(int w, int h)
  params:
  - name: w
    type: int
    desc: width of the graphics buffer
  - name: h
    type: int
    desc: height of the graphics buffer
  returns: PGraphics*
  related:
  - PGraphics_class
  - image
  impl: PGraphics* createGraphics(int w,int h){return new PGraphics(w,h);}
  under_the_hood_h: 'PGraphics* createGraphics(int w, int h);


    PGraphics* createGraphics(int w, int h, int renderer);'
  under_the_hood_cpp: "PGraphics* PApplet::createGraphics(int w,int h){return new PGraphics(w,h);}\n\n\
    PGraphics* PApplet::createGraphics(int w,int h,int renderer){\n    // The renderer argument genuinely\
    \ matters: a P3D buffer needs\n    // beginDraw() to set up a real perspective projection with depth\n\
    \    // testing enabled, instead of the flat 2D ortho projection (depth\n    // range -1..1) used\
    \ for plain 2D buffers -- without this, any 3D\n    // content drawn into the buffer (box(), sphere(),\
    \ translate(...,z))\n    // gets clipped away entirely by the paper-thin depth range, and\n    //\
    \ lighting/depth-testing never activates at all. See PGraphics::\n    // beginDraw()'s is3D branch\
    \ for the actual projection setup.\n    return new PGraphics(w, h, renderer == P3D);\n}"
- slug: hint
  name: hint()
  cat_tag: Rendering
  description: Set hints for the renderer. Use ENABLE_DEPTH_TEST, DISABLE_DEPTH_TEST, ENABLE_DEPTH_SORT,
    etc.
  syntax: void hint(int which)
  params:
  - name: which
    type: int
    desc: a hint constant such as ENABLE_DEPTH_TEST or DISABLE_DEPTH_TEST
  returns: void
  impl: "void hint(int which){\n    switch(which){\n        case ENABLE_DEPTH_TEST:  glEnable(GL_DEPTH_TEST);\
    \  break;\n        case DISABLE_DEPTH_TEST: glDisable(GL_DEPTH_TEST); break;\n        case ENABLE_DEPTH_SORT:\
    \  glEnable(GL_DEPTH_TEST);glDepthFunc(GL_LEQUAL); break;\n        case DISABLE_DEPTH_SORT: glDepthFunc(GL_LESS);\
    \ break;\n        default: break;\n    }\n}"
  under_the_hood_h: void hint(int which);
  under_the_hood_cpp: "void PApplet::hint(int which){\n    switch(which){\n        case ENABLE_DEPTH_TEST:\
    \  glEnable(GL_DEPTH_TEST);  break;\n        case DISABLE_DEPTH_TEST: glDisable(GL_DEPTH_TEST); break;\n\
    \        case ENABLE_DEPTH_SORT:  glEnable(GL_DEPTH_TEST);glDepthFunc(GL_LEQUAL); break;\n       \
    \ case DISABLE_DEPTH_SORT: glDepthFunc(GL_LESS); break;\n        default: break;\n    }\n}"
