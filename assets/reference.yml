entries:
- slug: BufferedReader_class
  name: BufferedReader
  cat_tag: Data / Composite
  description: Reads text from a file line by line. Create with createReader(). Close when done.
  syntax: BufferedReader* reader = createReader("data.txt")
  params: []
  returns: BufferedReader
  methods:
  - sig: readLine()
    desc: Reads and returns the next line as std::string. Returns empty string at EOF.
  - sig: ready()
    desc: Returns true if the file is open and has more data
  - sig: close()
    desc: Closes the file
  related:
  - createReader
  - loadStrings
  impl: "class BufferedReader {\n    std::ifstream f;\npublic:\n    explicit BufferedReader(const std::string&\
    \ path) : f(path) {}\n    bool        ready()    const { return f.is_open() && f.good(); }\n    std::string\
    \ readLine()       { std::string l; std::getline(f,l); return f?l:\"\"; }\n    void        close()\
    \          { f.close(); }\n};"
  under_the_hood_h: "class BufferedReader {\n    std::ifstream f;\npublic:\n    explicit BufferedReader(const\
    \ std::string& path) : f(path) {}\n    bool        ready()    const { return f.is_open() && f.good();\
    \ }\n    std::string readLine()       { std::string l; std::getline(f,l); return f?l:\"\"; }\n   \
    \ void        close()          { f.close(); }\n};"
  under_the_hood_cpp: BufferedReader* PApplet::createReader(const std::string& path){ return new BufferedReader(path);
- slug: HashMap_class
  name: HashMap
  cat_tag: Data / Composite
  description: A templated key-value map. In C++ Mode, std::map and std::unordered_map from the standard
    library are often more idiomatic, but HashMap is available for Processing Java compatibility.
  syntax: 'HashMap<std::string, int> map

    map.put("key", 1)

    int v = map.get("key")'
  params: []
  returns: HashMap<K,V>
  methods:
  - sig: put(K k, V v)
    desc: Inserts or updates a key-value pair
  - sig: get(K k)
    desc: Returns reference to value for key
  - sig: containsKey(K k)
    desc: Returns true if key exists
  - sig: remove(K k)
    desc: Removes a key-value pair
  - sig: size()
    desc: Returns number of entries
  - sig: isEmpty()
    desc: Returns true if empty
  - sig: clear()
    desc: Removes all entries
  - sig: keySet()
    desc: Returns a vector of all keys
  - sig: values()
    desc: Returns a vector of all values
  under_the_hood_h: "template<typename K, typename V>\nclass HashMap {\npublic:\n    std::map<K,V> data;\n\
    \n    void put(const K& k, const V& v)         { data[k]=v; }\n    V&   get(const K& k)          \
    \           { return data[k]; }\n    bool containsKey(const K& k)   const     { return data.count(k)>0;\
    \ }\n    bool containsValue(const V& v) const     { for(auto& p:data) if(p.second==v) return true;\
    \ return false; }\n    void remove(const K& k)                  { data.erase(k); }\n    int  size()\
    \                    const     { return (int)data.size(); }\n    bool isEmpty()                 const\
    \     { return data.empty(); }\n    void clear()                             { data.clear(); }\n \
    \   std::vector<K> keySet() const            { std::vector<K> r; for(auto& p:data) r.push_back(p.first);\
    \ return r; }\n    std::vector<V> values() const            { std::vector<V> r; for(auto& p:data)\
    \ r.push_back(p.second); return r; }\n    V& operator[](const K& k)               { return data[k];\
    \ }\n};"
  under_the_hood_cpp: null
- slug: PFont_class
  name: PFont
  cat_tag: Data / Composite
  description: Datatype for storing fonts. Load with loadFont() or create with createFont().
  syntax: 'PFont font = loadFont("font.ttf")

    PFont* font = createFont("Arial", 24)'
  params: []
  returns: PFont
  methods:
  - sig: PFont::list()
    desc: Returns a vector of all available font names
  related:
  - loadFont
  - createFont
  - textFont
  impl: "struct PFont {\n    static std::vector<std::string> list() {\n        std::vector<std::string>\
    \ fonts;\n        std::vector<std::string> dirs = {\"data\",\".\",\"/usr/share/fonts\",\"/usr/local/share/fonts\"\
    };\n        #ifdef _WIN32\n        dirs.push_back(\"C:/Windows/Fonts\");\n        #elif defined(__APPLE__)\n\
    \        dirs.push_back(\"/Library/Fonts\"); dirs.push_back(\"/System/Library/Fonts\");\n        #endif\n\
    \        if(getenv(\"HOME\")){ dirs.push_back(std::string(getenv(\"HOME\"))+\"/.fonts\"); }\n    \
    \    std::function<void(const std::string&)> scan=[&](const std::string& dir){\n            #ifndef\
    \ _WIN32\n            DIR* d=opendir(dir.c_str()); if(!d) return;\n            struct dirent* e;\n\
    \            while((e=readdir(d))!=nullptr){\n                std::string nm=e->d_name; if(nm==\"\
    .\"||nm==\"..\") continue;\n                std::string path=dir+\"/\"+nm;\n                if(e->d_type==DT_DIR){\
    \ scan(path); continue; }\n                if(nm.size()>4){std::string ext=nm.substr(nm.size()-4);\n\
    \                    if(ext==\".ttf\"||ext==\".otf\"||ext==\".TTF\"||ext==\".OTF\") fonts.push_back(nm);}\n\
    \            } closedir(d);\n            #else\n            WIN32_FIND_DATAA fd; HANDLE h2=FindFirstFileA((dir+\"\
    \\\\*\").c_str(),&fd);\n            if(h2==INVALID_HANDLE_VALUE) return;\n            do { std::string\
    \ nm=fd.cFileName; if(nm==\".\"||nm==\"..\") continue;\n                if(fd.dwFileAttributes&FILE_ATTRIBUTE_DIRECTORY){scan(dir+\"\
    \\\\\"+nm);continue;}\n                if(nm.size()>4){std::string ext=nm.substr(nm.size()-4);\n \
    \                   if(ext==\".ttf\"||ext==\".otf\"||ext==\".TTF\"||ext==\".OTF\") fonts.push_back(nm);}\n\
    \            } while(FindNextFileA(h2,&fd)); FindClose(h2);\n            #endif\n        };\n    \
    \    for(auto& d:dirs) scan(d);\n        std::sort(fonts.begin(),fonts.end());\n        fonts.erase(std::unique(fonts.begin(),fonts.end()),fonts.end());\n\
    \        return fonts;\n    }\n    std::string name;\n    float size = 12;\n    bool  loaded = false;\n\
    \n    PFont() = default;\n    PFont(const std::string& n, float s) : name(n), size(s), loaded(true)\
    \ {}\n};"
  under_the_hood_h: "struct PFont {\n    static std::vector<std::string> list() {\n        std::vector<std::string>\
    \ fonts;\n        std::vector<std::string> dirs = {\"data\",\".\",\"/usr/share/fonts\",\"/usr/local/share/fonts\"\
    };\n        #ifdef _WIN32\n        dirs.push_back(\"C:/Windows/Fonts\");\n        #elif defined(__APPLE__)\n\
    \        dirs.push_back(\"/Library/Fonts\"); dirs.push_back(\"/System/Library/Fonts\");\n        #endif\n\
    \        if(getenv(\"HOME\")){ dirs.push_back(std::string(getenv(\"HOME\"))+\"/.fonts\"); }\n    \
    \    std::function<void(const std::string&)> scan=[&](const std::string& dir){\n            #ifndef\
    \ _WIN32\n            DIR* d=opendir(dir.c_str()); if(!d) return;\n            struct dirent* e;\n\
    \            while((e=readdir(d))!=nullptr){\n                std::string nm=e->d_name; if(nm==\"\
    .\"||nm==\"..\") continue;\n                std::string path=dir+\"/\"+nm;\n                if(e->d_type==DT_DIR){\
    \ scan(path); continue; }\n                if(nm.size()>4){std::string ext=nm.substr(nm.size()-4);\n\
    \                    if(ext==\".ttf\"||ext==\".otf\"||ext==\".TTF\"||ext==\".OTF\") fonts.push_back(nm);}\n\
    \            } closedir(d);\n            #else\n            WIN32_FIND_DATAA fd; HANDLE h2=FindFirstFileA((dir+\"\
    \\\\*\").c_str(),&fd);\n            if(h2==INVALID_HANDLE_VALUE) return;\n            do { std::string\
    \ nm=fd.cFileName; if(nm==\".\"||nm==\"..\") continue;\n                if(fd.dwFileAttributes&FILE_ATTRIBUTE_DIRECTORY){scan(dir+\"\
    \\\\\"+nm);continue;}\n                if(nm.size()>4){std::string ext=nm.substr(nm.size()-4);\n \
    \                   if(ext==\".ttf\"||ext==\".otf\"||ext==\".TTF\"||ext==\".OTF\") fonts.push_back(nm);}\n\
    \            } while(FindNextFileA(h2,&fd)); FindClose(h2);\n            #endif\n        };\n    \
    \    for(auto& d:dirs) scan(d);\n        std::sort(fonts.begin(),fonts.end());\n        fonts.erase(std::unique(fonts.begin(),fonts.end()),fonts.end());\n\
    \        return fonts;\n    }\n    std::string name;\n    float size = 12;\n    bool  loaded = false;\n\
    \n    PFont() = default;\n    PFont(const std::string& n, float s) : name(n), size(s), loaded(true)\
    \ {}\n};"
  under_the_hood_cpp: null
- slug: PGraphics_class
  name: PGraphics
  cat_tag: Data / Composite
  description: An off-screen graphics buffer. Create with createGraphics(). Draw into it with beginDraw()/endDraw(),
    then display with image().
  syntax: PGraphics* pg = createGraphics(w, h)
  params: []
  returns: PGraphics
  methods:
  - sig: beginDraw()
    desc: Start drawing to the buffer
  - sig: endDraw()
    desc: Stop drawing to the buffer
  - sig: background(r,g,b)
    desc: Clear the buffer
  - sig: fill(r,g,b)
    desc: Set fill color
  - sig: stroke(r,g,b)
    desc: Set stroke color
  - sig: ellipse(x,y,w,h)
    desc: Draw ellipse
  - sig: rect(x,y,w,h)
    desc: Draw rectangle
  related:
  - createGraphics
  - image
  impl: PGraphics* createGraphics(int w,int h){return new PGraphics(w,h);}
  under_the_hood_h: "class PGraphics : public PImage {\npublic:\n    GLuint fbo = 0; // framebuffer object\n\
    \    GLuint rbo = 0; // renderbuffer (depth+stencil)\n    bool   active = false;\n\n    // Independent\
    \ per-buffer style state. Real Processing's PGraphics has\n    // its OWN fill/stroke/text/etc. settings,\
    \ completely separate from the\n    // main canvas's -- setting fill() on the main canvas must never\
    \ affect\n    // a PGraphics buffer, and vice versa. Previously every PGraphics method\n    // forwarded\
    \ directly to the single global PApplet::g_papplet singleton,\n    // meaning style state silently\
    \ bled between the main canvas and every\n    // buffer (e.g. a thick green main-canvas stroke would\
    \ incorrectly show\n    // up on an ellipse drawn inside a buffer that never set its own\n    // stroke).\
    \ beginDraw()/endDraw() now swap PApplet's current style out\n    // for this buffer's OWN remembered\
    \ style, and swap it back after,\n    // exactly mirroring how Java's PGraphics keeps independent\
    \ state.\n    struct StyleSnapshot {\n        // Defaults match PApplet's own real defaults (white\
    \ fill, black\n        // stroke) -- these are also real Processing's documented\n        // beginDraw()\
    \ defaults (\"Sets the default properties\"), NOT an\n        // arbitrary choice. The earlier version\
    \ of this struct had\n        // fillR=0 (black fill), which is backwards -- every fresh\n       \
    \ // PGraphics buffer with no explicit fill()/stroke() calls should\n        // look exactly like\
    \ a freshly created Processing sketch: white\n        // fill, black stroke, weight 1.\n        float\
    \ fillR=1, fillG=1, fillB=1, fillA=1;\n        float strokeR=0, strokeG=0, strokeB=0, strokeA=1;\n\
    \        float strokeW=1;\n        bool  doFill=true, doStroke=true, smoothing=true;\n        // BUG\
    \ FIX: these were raw 0/0/0 literals, which silently meant\n        // CORNER mode (CORNER=0) for\
    \ ellipseMode specifically, when real\n        // Processing's actual default is CENTER (=3). That\
    \ made every\n        // fresh PGraphics buffer's ellipse() calls interpret their first\n        //\
    \ two arguments as the bounding box's top-left corner instead of\n        // its center, shifting\
    \ every default-mode ellipse by half its\n        // width/height toward the bottom-right. rectMode's\
    \ and\n        // imageMode's real defaults ARE actually CORNER (=0), so those\n        // two were\
    \ correct by coincidence -- only currentEllipseMode\n        // needed the real CENTER constant.\n\
    \        // Using literal values, not the CORNER/CENTER named constants:\n        // those constants\
    \ are declared later in this file, after\n        // PGraphics's own definition, so they're not in\
    \ scope yet here.\n        // CORNER=0, CENTER=3 (see the static constexpr declarations\n        //\
    \ further down in this file).\n        int   currentRectMode=0 /*CORNER*/, currentEllipseMode=3 /*CENTER*/,\
    \ currentImageMode=0 /*CORNER*/;\n        float tintR=1, tintG=1, tintB=1, tintA=1;\n        bool\
    \  doTint=false;\n        int   colorModeVal=0;\n        float colorMaxH=255.f, colorMaxS=255.f, colorMaxB=255.f,\
    \ colorMaxA=255.f;\n        float g_textSize=14.0f;\n        int   g_textAlignX=0, g_textAlignY=0;\n\
    \        float g_textLeading=0.0f;\n        bool  initialized=false; // false until beginDraw() runs\
    \ once and sets real Processing defaults\n    };\n    StyleSnapshot myStyle;       // this buffer's\
    \ OWN persistent style\n    StyleSnapshot _savedMainStyle; // main canvas's style, stashed during\
    \ beginDraw()..endDraw()\n\n    // Multisampled render target: PGraphics now matches real Processing's\n\
    \    // default antialiasing (smooth(2) on P2D/P3D) by rendering into a\n    // multisample renderbuffer-backed\
    \ FBO, then resolving (blitting) down\n    // into the plain texture-backed FBO that drawPGraphicsRect\
    \ samples\n    // from. Without this, the main canvas's window-level MSAA never\n    // applied to\
    \ off-screen buffers at all.\n    GLuint msaaFbo = 0;\n    GLuint msaaColorRbo = 0;\n    GLuint msaaDepthRbo\
    \ = 0;\n    int    samples = 0; // 0 = no multisampling\n    bool   is3D = false; // true if created\
    \ via createGraphics(w,h,P3D)\n\n    PGraphics() = default;\n\n    PGraphics(int w, int h) : PImage(w,\
    \ h) {\n        // Can't reach PApplet::g_papplet here -- PApplet's complete type\n        // isn't\
    \ available yet at this point in the header (PGraphics is\n        // defined before it). Default\
    \ directly to real Processing's own\n        // P2D/P3D default (smooth(2)) rather than reaching across\
    \ that\n        // forward-reference gap. A sketch wanting a different level for\n        // its buffers\
    \ can extend this later if needed.\n        samples = 0; // TEMPORARY: forced off to test if MSAA\
    \ itself is the bug\n\n        // Resolve target: plain, non-multisampled FBO + texture --\n     \
    \   // unchanged from before, just filled via a blit-resolve now.\n        glGenFramebuffers(1, &fbo);\n\
    \        glBindFramebuffer(GL_FRAMEBUFFER, fbo);\n\n        if (texID == 0) glGenTextures(1, &texID);\n\
    \        glBindTexture(GL_TEXTURE_2D, texID);\n        glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, w,\
    \ h, 0, GL_RGBA, GL_UNSIGNED_BYTE, nullptr);\n        glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER,\
    \ GL_LINEAR);\n        glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);\n       \
    \ glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, texID, 0);\n\n     \
    \   glGenRenderbuffers(1, &rbo);\n        glBindRenderbuffer(GL_RENDERBUFFER, rbo);\n        glRenderbufferStorage(GL_RENDERBUFFER,\
    \ GL_DEPTH24_STENCIL8, w, h);\n        glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_DEPTH_STENCIL_ATTACHMENT,\
    \ GL_RENDERBUFFER, rbo);\n\n        glBindFramebuffer(GL_FRAMEBUFFER, 0);\n\n        // Multisample\
    \ render target: only created if antialiasing was\n        // actually requested. beginDraw() binds\
    \ THIS one; endDraw() blits\n        // it down into the resolve target above.\n        if (samples\
    \ > 0) {\n            glGenFramebuffers(1, &msaaFbo);\n            glBindFramebuffer(GL_FRAMEBUFFER,\
    \ msaaFbo);\n            glGenRenderbuffers(1, &msaaColorRbo);\n            glBindRenderbuffer(GL_RENDERBUFFER,\
    \ msaaColorRbo);\n            glRenderbufferStorageMultisample(GL_RENDERBUFFER, samples, GL_RGBA8,\
    \ w, h);\n            glFramebufferRenderbuffer(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_RENDERBUFFER,\
    \ msaaColorRbo);\n            glGenRenderbuffers(1, &msaaDepthRbo);\n            glBindRenderbuffer(GL_RENDERBUFFER,\
    \ msaaDepthRbo);\n            glRenderbufferStorageMultisample(GL_RENDERBUFFER, samples, GL_DEPTH24_STENCIL8,\
