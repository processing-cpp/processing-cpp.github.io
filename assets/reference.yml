  cat_tag: Shape / 2D Primitives
  description: Draws a rectangle to the screen. The fourth parameter can be a corner radius.
  syntax: 'void rect(float x, float y, float w, float h)

    void rect(float x, float y, float w, float h, float r)'
  params:
  - name: x
    type: float
    desc: x-coordinate of the upper-left corner
  - name: y
    type: float
    desc: y-coordinate of the upper-left corner
  - name: w
    type: float
    desc: width
  - name: h
    type: float
    desc: height
  - name: r
    type: float
    desc: corner radius (optional)
  returns: void
  related:
  - square
  - rectMode
  impl: "void rect(float x, float y, float w, float h) {\n    resolveRect(x, y, w, h);\n\n    if (doFill)\
    \ {\n        applyFill();\n        glBegin(GL_QUADS);\n            glVertex2f(x,     y    );\n   \
    \         glVertex2f(x + w, y    );\n            glVertex2f(x + w, y + h);\n            glVertex2f(x,\
    \     y + h);\n        glEnd();\n    }\n\n    if (doStroke) {\n        // Expand stroke outward by\
    \ half strokeWeight so it sits outside the fill\n        float half = strokeW * 0.5f;\n        applyStroke();\n\
    \        glLineWidth(strokeW);\n        glBegin(GL_LINE_LOOP);\n            glVertex2f(x - half, \
    \    y - half    );\n            glVertex2f(x + w + half, y - half    );\n            glVertex2f(x\
    \ + w + half, y + h + half);\n            glVertex2f(x - half,     y + h + half);\n        glEnd();\n\
    \        restoreLighting();\n    }\n}"
  under_the_hood_h: "void rect(float x, float y, float w, float h);\n\nvoid rect(float,float,float,float);\n\
    \nvoid rect(float,float,float,float,float);\n\ninline void rect(A x,B y,C w,D h2){ _api::rect((float)x,(float)y,(float)w,(float)h2);\n\
    \ninline void rect(A x,B y,C w,D h2,E r){ _api::rect((float)x,(float)y,(float)w,(float)h2,(float)r);\n\
    \nvoid rect(float x, float y, float w, float h, float r);\n\ntemplate<typename A,typename B,typename\
    \ C,typename D,typename=std::enable_if_t<std::is_arithmetic_v<A>&&std::is_arithmetic_v<B>&&std::is_arithmetic_v<C>&&std::is_arithmetic_v<D>>>\n\
    \    void rect(A x,B y,C w,D h){ rect((float)x,(float)y,(float)w,(float)h);\n\ntemplate<typename A,typename\
    \ B,typename C,typename D,typename E,typename=std::enable_if_t<std::is_arithmetic_v<A>&&std::is_arithmetic_v<B>&&std::is_arithmetic_v<C>&&std::is_arithmetic_v<D>&&std::is_arithmetic_v<E>>>\n\
    \    void rect(A x,B y,C w,D h,E r){ rect((float)x,(float)y,(float)w,(float)h,(float)r);\n\ninline\
    \ void rect(float x,float y,float w,float h){ if(PApplet::g_papplet) PApplet::g_papplet->rect(x,y,w,h);\
    \ }\n\ninline void rect(float x,float y,float w,float h,float r){ if(PApplet::g_papplet) PApplet::g_papplet->rect(x,y,w,h,r);\
    \ }\n\ninline void PGraphics::rect(float x, float y, float w2, float h2)   { if(PApplet::g_papplet)\
    \ PApplet::g_papplet->rect(x,y,w2,h2); }"
  under_the_hood_cpp: "void PApplet::rect(float x, float y, float w, float h) {\n    resolveRect(x, y,\
    \ w, h);\n\n    if (doFill) {\n        applyFill();\n        glBegin(GL_QUADS);\n            glVertex2f(x,\
    \     y    );\n            glVertex2f(x + w, y    );\n            glVertex2f(x + w, y + h);\n    \
    \        glVertex2f(x,     y + h);\n        glEnd();\n    }\n\n    if (doStroke) {\n        // Real\
    \ Processing centers the stroke ON the rectangle's boundary\n        // (half the weight extends inward\
    \ over the fill, half extends\n        // outward) -- NOT entirely outside it. The previous version\
    \ drew\n        // the stroke loop expanded fully outward, which meant increasing\n        // strokeWeight\
    \ never visually shrank the filled interior (it\n        // does in real Processing, since the inward\
    \ half of a thick\n        // stroke covers part of the fill), and glLineWidth-rendered\n        //\
    \ GL_LINE_LOOP gives flat, unmitered corners at large widths\n        // (visible gaps/seams at corners\
    \ instead of a clean joined\n        // outline). Drawing the stroke as actual filled quad geometry\
    \ --\n        // matching real Processing's approach -- fixes both: correct\n        // centering\
    \ AND clean mitered corners via overlapping quads.\n        applyStroke();\n        float half = strokeW\
    \ * 0.5f;\n        float xo = x - half, yo = y - half;       // outer edge\n        float xi = x +\
    \ half, yi = y + half;       // inner edge (top-left side)\n        float xow = x + w + half, yoh\
    \ = y + h + half; // outer edge (bottom-right side)\n        float xiw = x + w - half, yih = y + h\
    \ - half; // inner edge (bottom-right side)\n        glBegin(GL_QUADS);\n            // Top edge\n\
    \            glVertex2f(xo,  yo); glVertex2f(xow, yo); glVertex2f(xow, yi); glVertex2f(xo,  yi);\n\
    \            // Bottom edge\n            glVertex2f(xo,  yih); glVertex2f(xow, yih); glVertex2f(xow,\
    \ yoh); glVertex2f(xo,  yoh);\n            // Left edge (between top and bottom strips already drawn)\n\
    \            glVertex2f(xo,  yi); glVertex2f(xi,  yi); glVertex2f(xi,  yih); glVertex2f(xo,  yih);\n\
    \            // Right edge\n            glVertex2f(xiw, yi); glVertex2f(xow, yi); glVertex2f(xow,\
    \ yih); glVertex2f(xiw, yih);\n        glEnd();\n        restoreLighting();\n    }\n}\n\nvoid PApplet::rect(float\
    \ x, float y, float w, float h, float r) {\n    resolveRect(x, y, w, h);\n\n    // Clamp radius so\
    \ it never exceeds half the shortest side\n    r = min(r, min(w, h) * 0.5f);\n\n    const int cornerSegs\
    \ = 8;  // segments per 90-degree corner arc\n\n    // Emit a corner arc: center (cx,cy), from angle\
    \ sa to ea\n    auto corner = [&](float cx, float cy, float sa, float ea) {\n        for (int i =\
    \ 0; i <= cornerSegs; i++) {\n            float a = sa + (ea - sa) * i / cornerSegs;\n           \
    \ glVertex2f(cx + r * std::cos(a), cy + r * std::sin(a));\n        }\n    };\n\n    if (doFill) {\n\
    \        applyFill();\n        glBegin(GL_TRIANGLE_FAN);\n            // Fan center at rect midpoint\n\
    \            glVertex2f(x + w * 0.5f, y + h * 0.5f);\n            // Four corners in CCW order, closing\
    \ back to the first arc point\n            corner(x + r,     y + r,     PI,             PI + HALF_PI);\
    \  // top-left\n            corner(x + w - r, y + r,     PI + HALF_PI,   TWO_PI      );  // top-right\n\
    \            corner(x + w - r, y + h - r, 0,              HALF_PI     );  // bottom-right\n      \
    \      corner(x + r,     y + h - r, HALF_PI,        PI          );  // bottom-left\n            //\
    \ Close the fan back to the first arc point (avoids gap/seam)\n            glVertex2f(x + r + r *\
    \ std::cos(PI), y + r + r * std::sin(PI));\n        glEnd();\n    }\n\n    if (doStroke) {\n     \
    \   applyStroke();\n        glLineWidth(strokeW);\n        glBegin(GL_LINE_LOOP);\n            corner(x\
    \ + r,     y + r,     PI,           PI + HALF_PI);\n            corner(x + w - r, y + r,     PI +\
    \ HALF_PI, TWO_PI      );\n            corner(x + w - r, y + h - r, 0,            HALF_PI     );\n\
    \            corner(x + r,     y + h - r, HALF_PI,      PI          );\n        glEnd();\n    }\n\
    }\n\nvoid PApplet::square(float x,float y,float s){rect(x,y,s,s);"
