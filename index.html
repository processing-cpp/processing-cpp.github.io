<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing for C++</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    @font-face {
      font-family: "ProcessingSans";
      src: url("/assets/ProcessingSansPro-Regular.ttf") format("truetype");
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111; background: #fff; }
    a { color: #111; text-decoration: none; }

    /* Nav — matches all other pages via nav.js injection */
    #site-nav {
      border-bottom: 1px solid #e0e0e0;
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; position: sticky; top: 0; background: #fff; z-index: 100;
    }

    .layout { display: flex; min-height: calc(100vh - 60px); }

    /* Sidebar — matches other pages exactly */
    .sidebar {
      width: 220px;
      min-width: 220px;
      border-right: 1px solid #e0e0e0;
      padding: 1.5rem 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 60px;
      height: calc(100vh - 60px);
      background: #fff;
    }
    .sidebar a {
      font-size: 14px;
      color: #555;
      padding: 0.4rem 0;
      display: block;
    }
    .sidebar a:hover { color: #111; }
    .sidebar a.active { color: #111; font-weight: 500; }

    .page-body { flex: 1; overflow-x: hidden; }

    /* Hero */
    .main {
      height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      padding: 0 5rem;
      gap: 4rem;
      position: relative;
    }
    .left { flex: 1; }
    .left h1 {
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    .left h1 .proc {
      font-family: "ProcessingSans", sans-serif;
      color: #003f6b;
      font-weight: 400;
    }
    .left p { font-size: 1rem; color: #555; }
    .left p a { color: #111; border-bottom: 1px solid #111; font-weight: 500; }
    .right { flex: 1; display: flex; justify-content: flex-end; align-items: center; }
    .right img { width: 340px; height: 340px; object-fit: contain; }

    /* Arrow — positioned inside .main so it's always visible above the fold */
    .scroll-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      color: #bbb;
      font-size: 22px;
      animation: bounce 1.8s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    /* Examples section */
    .examples-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 5rem 3rem;
      border-top: 1px solid #e0e0e0;
    }
    .examples-section h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 2.5rem; }
    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }
    .example-card { background: #fff; overflow: hidden; }
    .example-canvas { width: 100%; aspect-ratio: 1; background: #000; display: block; }
    .example-info { padding: 1rem 1.25rem; border-top: 1px solid #e0e0e0; }
    .example-info h3 { font-size: 14px; font-weight: 500; margin-bottom: 0.2rem; }
    .example-info p { font-size: 12px; color: #888; }
    .examples-footer { padding: 3rem; text-align: center; }
    .examples-footer a { font-size: 14px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
    .examples-footer a:hover { color: #111; border-color: #111; }

    footer { border-top: 1px solid #e0e0e0; padding: 2rem; text-align: center; font-size: 13px; color: #888; }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed; top: 60px; left: -240px;
        width: 240px; height: calc(100vh - 60px);
        z-index: 200; transition: left 0.25s ease;
        box-shadow: 2px 0 12px rgba(0,0,0,0.08);
      }
      .sidebar.open { left: 0; }
      .main { flex-direction: column; padding: 3rem 2rem; height: auto; gap: 2rem; }
      .right img { width: 180px; height: 180px; }
      .scroll-hint { position: static; transform: none; display: block; text-align: center; padding: 1rem 0; animation: none; }
    }
  </style>
</head>
<body>

<nav id="site-nav"></nav>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>

  <div class="page-body">
    <div class="main">
      <div class="left">
        <h1>C++ Mode for<br><span class="proc">Processing</span></h1>
        <p>Explore the <a href="/reference">reference</a> for the full API.</p>
        <p style="margin-top:1rem;font-size:0.85rem;color:#aaa;">Independently developed by Jose Llamas</p>
      </div>
      <div class="right">
        <img src="assets/cpp-logo.png" alt="Processing for C++">
      </div>
      <div class="scroll-hint">↓</div>
    </div>

    <div class="examples-section">
      <h2>Examples</h2>
      <div class="examples-grid">
        <div class="example-card">
          <iframe class="example-canvas" id="c1" width="300" height="300" style="width:100%;aspect-ratio:1;border:none;display:block;background:#000;" scrolling="no"></iframe><script>(function(){const iframe=document.getElementById('c1');const doc=iframe.contentDocument||iframe.contentWindow.document;doc.open();doc.write(`<!DOCTYPE html><html><head><style>*{margin:0;padding:0;}body{overflow:hidden;}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script></head><body><script>let x1, x2, y1, y2;
let angle1 = 0;
let angle2 = 0;
let scalar = 70.0;

function setup() {
  createCanvas(300,300);
  noStroke();
  rectMode(CENTER);
}

function draw() {
  background(0);

  let ang1 = radians(angle1);
  let ang2 = radians(angle2);

  x1 = width / 2 + scalar * cos(ang1);
  x2 = width / 2 + scalar * cos(ang2);

  y1 = height / 2 + scalar * sin(ang1);
  y2 = height / 2 + scalar * sin(ang2);

  fill(255);
  rect(width * 0.5, height * 0.5, 140, 140);

  fill(0, 102, 153);
  ellipse(x1, height * 0.5 - 120, scalar, scalar);
  ellipse(x2, height * 0.5 + 120, scalar, scalar);

  fill(255, 204, 0);
  ellipse(width * 0.5 - 120, y1, scalar, scalar);
  ellipse(width * 0.5 + 120, y2, scalar, scalar);

  angle1 += 2;
  angle2 += 3;
}<\/script></body></html>`);doc.close();})();</script>
          <div class="example-info"><h3>Sine Cosine</h3><p>Math example</p></div>
        </div>
        <div class="example-card">
          <iframe class="example-canvas" id="c2" width="300" height="300" style="width:100%;aspect-ratio:1;border:none;display:block;background:#000;" scrolling="no"></iframe><script>(function(){const iframe=document.getElementById('c2');const doc=iframe.contentDocument||iframe.contentWindow.document;doc.open();doc.write(`<!DOCTYPE html><html><head><style>*{margin:0;padding:0;}body{overflow:hidden;}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script></head><body><script>let _scale;

function setup() {
  createCanvas(300,300);
  noStroke();
  _scale = width / 20.0;
}

function draw() {
  for (let i = 0; i < _scale; i++) {
    colorMode(RGB, (i + 1) * _scale * 10.0);

    fill(millis() % ((i + 1) * _scale * 10.0));

    rect(i * _scale, 0, _scale, height);
  }
}<\/script></body></html>`);doc.close();})();</script>
          <div class="example-info"><h3>Milliseconds</h3><p>Input example</p></div>
        </div>
        <div class="example-card">
          <iframe class="example-canvas" id="c3" width="300" height="300" style="width:100%;aspect-ratio:1;border:none;display:block;background:#000;" scrolling="no"></iframe><script>(function(){const iframe=document.getElementById('c3');const doc=iframe.contentDocument||iframe.contentWindow.document;doc.open();doc.write(`<!DOCTYPE html><html><head><style>*{margin:0;padding:0;}body{overflow:hidden;}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"><\/script></head><body><script>let pg;

function setup() {
  createCanvas(300,300);
  pg = createGraphics(400, 200);
}

function draw() {
  fill(0, 12);
  rect(0, 0, width, height);

  fill(255);
  noStroke();
  ellipse(mouseX, mouseY, 60, 60);

  pg.background(51);
  pg.noFill();
  pg.stroke(255);
  pg.ellipse(mouseX - 120, mouseY - 60, 60, 60);

  image(pg, 120, 60);
}<\/script></body></html>`);doc.close();})();</script>
          <div class="example-info"><h3>Create Graphics</h3><p>Structure example</p></div>
        </div>
      </div>
      <div class="examples-footer">
        <a href="/examples">View all examples →</a>
      </div>
    </div>
  </div>
</div>

<footer><p>Processing for C++</p></footer>

<script src="./assets/nav.js"></script>
</body>
</html>
