<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor - C++ Mode for Processing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="../assets/cppmode-theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #111; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Override nav.js nav to not be sticky in the editor - it already has fixed height */
    #site-nav { flex-shrink: 0; position: static !important; }

    /* Hide the sidebar - editor uses full width */
    #site-sidebar { display: none; }

    .editor-layout { display: flex; flex: 1; overflow: hidden; }

    .editor-pane { display: flex; flex-direction: column; width: 50%; border-right: 1px solid #e0e0e0; }
    .preview-pane { display: flex; flex-direction: column; width: 50%; }

    .pane-toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: #f7f7f7;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .pane-label { font-size: 12px; color: #888; flex: 1; font-family: "SF Mono", "Fira Code", monospace; }

    #status { font-size: 12px; color: #888; }
    #status.compiling { color: #c07000; }
    #status.error { color: #c00; }
    #status.ok { color: #3a3; }

    .btn-run {
      background: #e8b400;
      color: #111;
      border: none;
      padding: 0.4rem 1.1rem;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-run:hover { background: #d4a300; }
    .btn-run:disabled { background: #e0e0e0; color: #aaa; cursor: not-allowed; }

    .btn-stop {
      background: #f0f0f0;
      color: #555;
      border: 1px solid #e0e0e0;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-stop:hover { background: #e6e6e6; }

    .CodeMirror { flex: 1; height: 100%; font-size: 13px; line-height: 1.6; }
    .CodeMirror-scroll { height: 100% !important; }

    #preview-area {
      flex: 1;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #preview-area canvas { display: block !important; }

    #preview-placeholder { color: #555; font-size: 13px; text-align: center; line-height: 2.2; }
    #preview-placeholder kbd {
      background: #222;
      border: 1px solid #444;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      color: #bbb;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    #error-panel {
      display: none;
      background: #fff5f5;
      border-top: 1px solid #fcc;
      padding: 0.6rem 1rem;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11.5px;
      color: #c00;
      max-height: 130px;
      overflow-y: auto;
      white-space: pre;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<nav id="site-nav"></nav>

<div class="editor-layout">
  <div class="editor-pane">
    <div class="pane-toolbar">
      <span class="pane-label">sketch.pde</span>
      <span id="status"></span>
      <button class="btn-stop" onclick="stopSketch()">Stop</button>
      <button class="btn-run" id="btn-run" onclick="runSketch()">&#9654; Run</button>
    </div>
    <textarea id="code"></textarea>
    <div id="error-panel"></div>
  </div>

  <div class="preview-pane">
    <div class="pane-toolbar">
      <span class="pane-label">preview</span>
    </div>
    <div id="preview-area">
      <div id="preview-placeholder">
        Press <kbd>Ctrl+Enter</kbd> to run your sketch
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="../assets/cppmode-keywords.js"></script>
<script src="../assets/cm-cppmode.js"></script>
<script src="../assets/cppmode.js"></script>
<script src="../assets/nav.js"></script>
<script>
const API = 'https://bench-volumes-pontiac-riders.trycloudflare.com';

const DEFAULT = `float angle = 0;

void setup() {
  size(500, 400, P3D);
}

void draw() {
  background(20);
  lights();
  translate(width/2, height/2);
  rotateX(angle * 0.7f);
  rotateY(angle);
  fill(232, 180, 0);
  box(130);
  angle += 0.02f;
}`;

const editor = CodeMirror.fromTextArea(document.getElementById('code'), {
  mode: 'cppmode',
  theme: 'cppmode',
  lineNumbers: true,
  indentUnit: 2,
  tabSize: 2,
  indentWithTabs: false,
  autofocus: true,
  matchBrackets: true,
  autoCloseBrackets: true,
  lineWrapping: false,
  extraKeys: {
    'Ctrl-Enter': runSketch,
    'Cmd-Enter': runSketch,
    'Tab': cm => cm.execCommand('indentMore'),
    'Shift-Tab': cm => cm.execCommand('indentLess'),
    'Backspace': cm => cm.execCommand('delCharBefore'),
  },
});



function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

function stopSketch() {
  const area = document.getElementById('preview-area');
  const canvas = area.querySelector('canvas');
  if (canvas) canvas.remove();
  const placeholder = document.getElementById('preview-placeholder');
  if (placeholder) placeholder.style.display = '';
  window.Module = undefined;
  setStatus('');
  editor.focus();
}

async function runSketch() {
  const btn = document.getElementById('btn-run');
  const errorPanel = document.getElementById('error-panel');
  errorPanel.style.display = 'none';
  errorPanel.textContent = '';
  btn.disabled = true;
  setStatus('Compiling...', 'compiling');

  let resp, data;
  try {
    resp = await fetch(API + '/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: editor.getValue() }),
    });
    data = await resp.json();
  } catch(e) {
    setStatus('Server unreachable', 'error');
    errorPanel.textContent = 'Could not reach compile server:\n' + e.message;
    errorPanel.style.display = 'block';
    btn.disabled = false;
    return;
  }

  if (!resp.ok || data.error) {
    setStatus('Error', 'error');
    errorPanel.textContent = data.error || 'Unknown error';
    errorPanel.style.display = 'block';
    btn.disabled = false;
    return;
  }

  setStatus('Loading...', 'compiling');
  btn.disabled = false;
  stopSketch();

  const area = document.getElementById('preview-area');
  const placeholder = document.getElementById('preview-placeholder');
  if (placeholder) placeholder.style.display = 'none';

  const canvas = document.createElement('canvas');
  canvas.id = 'canvas';
  canvas.setAttribute('tabindex', '-1');
  area.appendChild(canvas);

  const wasmBinary = Uint8Array.from(atob(data.wasm), c => c.charCodeAt(0));
  const dataBytes  = data.data ? Uint8Array.from(atob(data.data), c => c.charCodeAt(0)) : null;

  window.Module = {
    canvas: canvas,
    wasmBinary: wasmBinary,
    onRuntimeInitialized: function() { setStatus('Running', 'ok'); },
    print:    t => console.log('[sketch]', t),
    printErr: t => console.warn('[sketch]', t),
  };

  if (dataBytes) {
    window.Module.getPreloadedPackage = function(name, size) { return dataBytes.buffer; };
  }

  const blob = new Blob([data.js], { type: 'application/javascript' });
  const blobUrl = URL.createObjectURL(blob);
  const script = document.createElement('script');
  script.src = blobUrl;
  script.onload = () => URL.revokeObjectURL(blobUrl);
  script.onerror = () => {
    setStatus('Load error', 'error');
    errorPanel.textContent = 'Failed to load compiled sketch.';
    errorPanel.style.display = 'block';
  };
  document.head.appendChild(script);
}

const _origPreventDefault = Event.prototype.preventDefault;
Event.prototype.preventDefault = function() {
  if (this.type === 'keydown' || this.type === 'keyup' || this.type === 'keypress') {
    const ta = document.querySelector('.CodeMirror textarea');
    if (ta && document.activeElement === ta) return;
  }
  return _origPreventDefault.call(this);
};

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runSketch(); }
});
</script>
</body>
</html>
